        <section>
            <h2>Formulir Pemesanan / Pertanyaan</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Kirim Pesan Proyek 3D</legend>

                    <p>
                        <label for="nama">Nama Lengkap:</label><br>
                        <input type="text" id="nama" name="nama" required>
                    </p>

                    <p>
                        <label for="email">Alamat Email:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="layanan">Jenis Layanan yang Dibutuhkan:</label><br>
                        <input type="text" id="layanan" name="layanan" placeholder="Contoh: Pembuatan Ped Kustom" required>
                    </p>

                    <p>
                        <label for="pesan">Detail Pesan / Detail Proyek:</label><br>
                        <textarea id="pesan" name="pesan" rows="5" required></textarea>
                    </p>

                    <button type="submit">Kirim Pesan</button>
                </fieldset>
            </form>
        </section>
